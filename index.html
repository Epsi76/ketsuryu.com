<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KetsuRyu</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #050a0c;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      color: #d8c8a8;
      cursor: none;
    }
    canvas { display: block; }

    #title {
      position: fixed;
      left: 50%; bottom: 26px;
      transform: translateX(-50%);
      letter-spacing: 0.5em;
      font-size: 11px;
      text-transform: uppercase;
      color: rgba(216, 200, 168, 0.55);
      text-shadow: 0 0 12px rgba(255, 120, 60, 0.25);
      pointer-events: none;
      user-select: none;
      z-index: 5;
    }

    #cursor {
      position: fixed;
      width: 14px; height: 14px;
      border: 1px solid rgba(255, 200, 160, 0.7);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      mix-blend-mode: screen;
      z-index: 9;
      transition: transform 0.08s ease-out;
    }
    #cursor::before {
      content: ""; position: absolute; inset: 5px;
      background: #ffb074; border-radius: 50%;
      box-shadow: 0 0 14px #ff7a3c;
    }
  </style>
</head>
<body>
  <div id="cursor"></div>
  <div id="title">Ketsu &middot; Ryu</div>

  <script type="importmap">
  {
    "imports": {
      "three":         "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

    // ============================================================
    //  Palette (sumi-e / irezumi reference)
    // ============================================================
    const COL = {
      INK_DEEP:    0x06121a,
      TEAL_DARK:   0x0e2a2c,
      TEAL_MID:    0x1a4344,
      TEAL_LIGHT:  0x355e5c,
      MOON:        0xfff0c8,
      DRAGON_BODY: 0x16110d,
      DRAGON_BELLY:0x9c8662,
      RIM_FIRE:    0xff5e2c,
      MANE_HOT:    0xff8a3a,
      MANE_GOLD:   0xffc674,
      PETAL_LIGHT: 0xffc7d8,
      PETAL_DEEP:  0xff8aaa,
      EYE_GLOW:    0xffe89a,
    };

    // ============================================================
    //  Scene / Renderer / Camera
    // ============================================================
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a1c1e, 0.012);

    const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 400);
    camera.position.set(0, 2, 38);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    // ============================================================
    //  Background — gradient sky + soft moon + god rays (full-screen shader)
    // ============================================================
    const bgUniforms = {
      uTime:       { value: 0 },
      uMouse:      { value: new THREE.Vector2(0, 0) },
      uResolution: { value: new THREE.Vector2(innerWidth, innerHeight) },
    };
    const bgMaterial = new THREE.ShaderMaterial({
      uniforms: bgUniforms,
      depthTest: false, depthWrite: false,
      vertexShader: /*glsl*/`
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = vec4(position.xy, 1.0, 1.0); }
      `,
      fragmentShader: /*glsl*/`
        precision highp float;
        varying vec2 vUv;
        uniform float uTime;
        uniform vec2  uMouse;

        // Hash + value noise
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float vnoise(vec2 p){
          vec2 i = floor(p), f = fract(p);
          float a = hash(i), b = hash(i + vec2(1,0));
          float c = hash(i + vec2(0,1)), d = hash(i + vec2(1,1));
          vec2 u = f*f*(3.0-2.0*f);
          return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
        }
        float fbm(vec2 p){
          float v = 0.0, a = 0.5;
          for(int i=0; i<5; i++){ v += a*vnoise(p); p *= 2.03; a *= 0.5; }
          return v;
        }

        void main() {
          vec2 uv = vUv;
          vec2 puv = uv + uMouse * 0.02;

          // Vertical gradient: ink -> teal -> deeper
          vec3 colDeep = vec3(0.020, 0.060, 0.075);
          vec3 colMid  = vec3(0.060, 0.180, 0.190);
          vec3 colTop  = vec3(0.030, 0.080, 0.110);
          vec3 col = mix(colDeep, colMid, smoothstep(0.0, 0.55, uv.y));
          col = mix(col, colTop, smoothstep(0.55, 1.0, uv.y));

          // Soft moon (top right)
          vec2 moonPos = vec2(0.80 - uMouse.x * 0.02, 0.74 - uMouse.y * 0.02);
          float r = length((puv - moonPos) * vec2(1.0, 1.05));
          float disc  = smoothstep(0.075, 0.062, r);
          float halo  = exp(-r * 6.0) * 0.35;
          float bigGl = exp(-r * 2.0) * 0.10;
          col += vec3(1.00, 0.94, 0.78) * (disc * 0.9 + halo + bigGl);

          // God rays from upper-right
          vec2 rayOrig = vec2(0.78, 1.10);
          vec2 d = puv - rayOrig;
          float ang = atan(d.y, d.x);
          float rays = 0.5 + 0.5 * sin(ang * 14.0 + uTime * 0.05);
          rays *= smoothstep(0.0, 1.0, 1.0 - length(d));
          rays *= smoothstep(-0.3, -1.4, d.y); // fade away from light source
          col += vec3(1.0, 0.92, 0.72) * rays * 0.10;

          // Atmospheric ink mist (slow FBM drift)
          float mist = fbm(puv * 2.6 + vec2(uTime * 0.012, -uTime * 0.008));
          mist = smoothstep(0.35, 0.85, mist);
          col = mix(col, vec3(0.02, 0.07, 0.08), mist * 0.55);

          // Subtle vignette
          float v = smoothstep(1.2, 0.35, length(uv - 0.5));
          col *= 0.55 + 0.45 * v;

          gl_FragColor = vec4(col, 1.0);
        }
      `,
    });
    const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMaterial);
    bgQuad.frustumCulled = false;
    bgQuad.renderOrder = -10;
    scene.add(bgQuad);

    // ============================================================
    //  Distant mountain silhouettes (parallax layers)
    // ============================================================
    function makeMountainLayer({ z, color, peaks, height, opacity = 1 }) {
      const w = 220;
      const shape = new THREE.Shape();
      shape.moveTo(-w/2, -20);
      const step = w / peaks;
      for (let i = 0; i <= peaks; i++) {
        const x = -w/2 + i * step;
        const noise = Math.sin(i * 1.3) * 0.3 + Math.sin(i * 0.7) * 0.5 + Math.cos(i * 2.1) * 0.2;
        const h = height * (0.55 + noise * 0.45);
        shape.lineTo(x, h);
      }
      shape.lineTo(w/2, -20);
      shape.closePath();
      const geo = new THREE.ShapeGeometry(shape, 1);
      const mat = new THREE.MeshBasicMaterial({
        color, transparent: opacity < 1, opacity, fog: true, depthWrite: false,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.z = z;
      mesh.position.y = -10;
      return mesh;
    }
    const mountainsFar  = makeMountainLayer({ z: -110, color: 0x142e30, peaks: 24, height: 24 });
    const mountainsMid  = makeMountainLayer({ z:  -75, color: 0x0c2022, peaks: 18, height: 18 });
    const mountainsNear = makeMountainLayer({ z:  -45, color: 0x06141a, peaks: 12, height: 12 });
    scene.add(mountainsFar, mountainsMid, mountainsNear);

    // Ink mist puffs floating around
    const mistGroup = new THREE.Group();
    {
      const mistMat = new THREE.MeshBasicMaterial({
        color: 0x07181a, transparent: true, opacity: 0.55, fog: true, depthWrite: false,
      });
      for (let i = 0; i < 14; i++) {
        const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), mistMat);
        m.position.set(
          (Math.random() - 0.5) * 140,
          -2 + Math.random() * 18,
          -25 - Math.random() * 60
        );
        const s = 6 + Math.random() * 14;
        m.scale.set(s * 1.6, s * 0.8, s);
        m.userData = { driftPhase: Math.random() * Math.PI * 2, baseX: m.position.x };
        mistGroup.add(m);
      }
    }
    scene.add(mistGroup);

    // ============================================================
    //  Lights
    // ============================================================
    scene.add(new THREE.AmbientLight(0x2a3d40, 0.55));
    const moonLight = new THREE.DirectionalLight(0xffe6c2, 0.65);
    moonLight.position.set(20, 18, 6);
    scene.add(moonLight);
    const rimDir = new THREE.DirectionalLight(0xff7a3a, 0.55);
    rimDir.position.set(-12, -6, 8);
    scene.add(rimDir);

    // Fire glow sticking near the dragon's mane
    const maneLight = new THREE.PointLight(0xff7a3a, 2.6, 22, 1.6);
    scene.add(maneLight);

    // ============================================================
    //  Dragon material — rim-lit ink with warm fire edge
    // ============================================================
    function makeInkMaterial({ color = COL.DRAGON_BODY, rimColor = COL.RIM_FIRE, rimStrength = 1.3, rimPower = 2.4, emissive = 0x000000, emissiveIntensity = 0 } = {}) {
      const mat = new THREE.MeshStandardMaterial({
        color,
        roughness: 0.55,
        metalness: 0.35,
        emissive,
        emissiveIntensity,
      });
      mat.userData.rimColor = new THREE.Color(rimColor);
      mat.userData.rimPower = rimPower;
      mat.userData.rimStrength = rimStrength;
      mat.onBeforeCompile = (shader) => {
        shader.uniforms.rimColor    = { value: mat.userData.rimColor };
        shader.uniforms.rimPower    = { value: mat.userData.rimPower };
        shader.uniforms.rimStrength = { value: mat.userData.rimStrength };
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <common>',
          `#include <common>
           uniform vec3  rimColor;
           uniform float rimPower;
           uniform float rimStrength;`
        ).replace(
          'vec3 outgoingLight = totalDiffuse + totalSpecular + totalEmissiveRadiance;',
          `vec3 outgoingLight = totalDiffuse + totalSpecular + totalEmissiveRadiance;
           {
             vec3 _vDir = normalize(vViewPosition);
             float _rim = pow(1.0 - clamp(dot(normalize(normal), _vDir), 0.0, 1.0), rimPower);
             outgoingLight += rimColor * _rim * rimStrength;
           }`
        );
      };
      return mat;
    }

    // ============================================================
    //  Dragon — parametric S-curve spine, animated, head tracks mouse
    // ============================================================
    const SPINE_N = 80;
    const dragonGroup = new THREE.Group();
    scene.add(dragonGroup);

    const bodyMat   = makeInkMaterial({ color: COL.DRAGON_BODY, rimColor: COL.RIM_FIRE, rimStrength: 1.4, rimPower: 2.2 });
    const bellyMat  = makeInkMaterial({ color: COL.DRAGON_BELLY, rimColor: COL.MANE_GOLD, rimStrength: 0.6, rimPower: 3.0 });
    const finMat    = makeInkMaterial({ color: 0x2a1610, rimColor: COL.RIM_FIRE, rimStrength: 1.8, rimPower: 1.6, emissive: 0x381205, emissiveIntensity: 0.3 });
    const hornMat   = makeInkMaterial({ color: 0x2a201a, rimColor: 0xffd6a0, rimStrength: 1.0, rimPower: 2.8 });

    function radiusFor(i) {
      if (i === 0) return 1.05;
      if (i < 5)   return 0.95 - i * 0.04;
      if (i < 14)  return 0.85;
      const t = (i - 14) / (SPINE_N - 14);
      const bulge = Math.sin(t * Math.PI) * 0.18;
      return Math.max(0.06, 0.85 + bulge - t * 0.78);
    }

    const segments = [];
    const spine = new Array(SPINE_N).fill(0).map(() => new THREE.Vector3());

    for (let i = 0; i < SPINE_N; i++) {
      const r = radiusFor(i);
      const seg = new THREE.Group();

      // Body sphere (dark, rim-lit)
      const body = new THREE.Mesh(new THREE.SphereGeometry(r, 22, 14), bodyMat);
      body.scale.z = 1.32;
      seg.add(body);

      // Belly stripe (thin underside band)
      if (i > 1 && i < SPINE_N - 6) {
        const belly = new THREE.Mesh(new THREE.SphereGeometry(r * 0.82, 16, 10, 0, Math.PI * 2, Math.PI * 0.45, Math.PI * 0.35), bellyMat);
        belly.scale.set(0.78, 1.0, 1.32);
        belly.position.y = -r * 0.08;
        seg.add(belly);
      }

      // Dorsal fin: jagged red-orange spines
      if (i > 3 && i < SPINE_N - 8 && i % 2 === 0) {
        const fin = new THREE.Mesh(new THREE.ConeGeometry(0.13, r * 1.6, 6), finMat);
        fin.position.y = r * 0.85;
        fin.rotation.x = -0.05;
        seg.add(fin);
      }

      dragonGroup.add(seg);
      segments.push({ group: seg, body, r });
    }

    // ---- Head ornaments ----
    const headSeg  = segments[0];
    const headMesh = headSeg.group;
    const headR    = headSeg.r;
    {
      // Eyes (glowing yellow)
      const eyeMat = new THREE.MeshBasicMaterial({ color: COL.EYE_GLOW });
      const eyeGeo = new THREE.SphereGeometry(0.13, 12, 12);
      const eL = new THREE.Mesh(eyeGeo, eyeMat); eL.position.set(-0.45, 0.36, -0.55);
      const eR = new THREE.Mesh(eyeGeo, eyeMat); eR.position.set( 0.45, 0.36, -0.55);
      headMesh.add(eL); headMesh.add(eR);

      const pupMat = new THREE.MeshBasicMaterial({ color: 0x100804 });
      const pupGeo = new THREE.SphereGeometry(0.06, 10, 10);
      const pL = new THREE.Mesh(pupGeo, pupMat); pL.position.set(-0.45, 0.36, -0.66);
      const pR = new THREE.Mesh(pupGeo, pupMat); pR.position.set( 0.45, 0.36, -0.66);
      headMesh.add(pL); headMesh.add(pR);

      // Snout
      const snout = new THREE.Mesh(
        new THREE.SphereGeometry(0.6, 16, 12),
        bodyMat
      );
      snout.scale.set(0.95, 0.78, 1.18);
      snout.position.set(0, -0.05, -0.95);
      headMesh.add(snout);

      // Lower jaw — small open mouth hint
      const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.18, 0.55), bodyMat);
      jaw.position.set(0, -0.35, -0.85);
      headMesh.add(jaw);

      // Fangs
      const fangMat = new THREE.MeshStandardMaterial({ color: 0xfff5e0, roughness: 0.4, metalness: 0.2, emissive: 0x6a4020, emissiveIntensity: 0.15 });
      for (const sx of [-0.18, 0.18]) {
        const fang = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.22, 6), fangMat);
        fang.position.set(sx, -0.18, -1.05);
        fang.rotation.x = Math.PI;
        headMesh.add(fang);
      }

      // Branching antler-like horns
      function buildHorn(side) {
        const horn = new THREE.Group();
        let prev = new THREE.Vector3();
        for (let i = 0; i < 5; i++) {
          const len = 0.65 - i * 0.09;
          const rad = 0.12 - i * 0.02;
          const c = new THREE.Mesh(new THREE.ConeGeometry(rad, len, 8), hornMat);
          c.position.copy(prev);
          c.position.y += len * 0.5;
          c.position.x += side * (i * 0.10);
          c.position.z -= i * 0.07;
          c.rotation.z = side * (0.22 + i * 0.10);
          c.rotation.x = -i * 0.06;
          horn.add(c);
          prev = new THREE.Vector3(c.position.x + side * 0.1, c.position.y + len * 0.5, c.position.z - 0.05);
        }
        return horn;
      }
      const hL = buildHorn(-1); hL.position.set(-0.32, headR * 0.55, 0.10); headMesh.add(hL);
      const hR = buildHorn( 1); hR.position.set( 0.32, headR * 0.55, 0.10); headMesh.add(hR);

      // Mane: cluster of warm emissive spheres along nape
      const maneColors = [COL.MANE_HOT, COL.MANE_GOLD, COL.RIM_FIRE, 0xffd07a, 0xff5a25];
      for (let i = 0; i < 26; i++) {
        const c = maneColors[i % maneColors.length];
        const m = new THREE.Mesh(
          new THREE.SphereGeometry(0.16 + Math.random() * 0.12, 10, 8),
          new THREE.MeshStandardMaterial({
            color: c, emissive: c, emissiveIntensity: 1.4,
            roughness: 0.35, metalness: 0.1,
          })
        );
        m.position.set(
          (Math.random() - 0.5) * 0.85,
          0.35 + Math.random() * 0.55,
          0.45 + Math.random() * 0.85
        );
        headMesh.add(m);
      }
    }

    // Whiskers (long flowing)
    function makeWhisker() {
      const mat = new THREE.MeshStandardMaterial({ color: 0x1a120c, emissive: 0x2a0e04, emissiveIntensity: 0.25, metalness: 0.2, roughness: 0.5 });
      const m = new THREE.Mesh(new THREE.BufferGeometry(), mat);
      headMesh.add(m);
      return m;
    }
    const whiskerL = makeWhisker();
    const whiskerR = makeWhisker();

    function rebuildWhisker(mesh, side, t) {
      const pts = [];
      const N = 26;
      for (let i = 0; i <= N; i++) {
        const u = i / N;
        const z = -0.95 - u * 6.0;
        const wave = Math.sin(t * 2.3 + u * 5.5 + side * 1.2) * 0.7 * u;
        const drop = -u * 0.7;
        pts.push(new THREE.Vector3(side * (0.28 + u * 0.7 + wave * 0.3), drop + wave * 0.45, z));
      }
      const curve = new THREE.CatmullRomCurve3(pts);
      const newGeo = new THREE.TubeGeometry(curve, 28, 0.045, 6, false);
      mesh.geometry.dispose();
      mesh.geometry = newGeo;
    }

    // ============================================================
    //  Spine animation — animated S-curve, head tracks mouse
    // ============================================================
    const mouse = { x: 0, y: 0, tx: 0, ty: 0 };

    function spineSample(t, time) {
      // t ∈ [0,1] from head (0) to tail (1)
      // Anchor point in world space, sweeping through a flowing S
      const ar = 14;                                         // arc radius
      const phase = time * 0.18;
      const x =  Math.sin((1 - t) * 3.4 + phase) * ar
              + Math.sin((1 - t) * 1.2 + phase * 0.7) * 4
              - 4;
      const y =  Math.cos((1 - t) * 2.6 + phase) * 5
              + Math.sin((1 - t) * 4.8 + phase * 1.4) * 1.5
              + 2;
      const z =  Math.cos((1 - t) * 2.0 + phase * 0.9) * 6
              - t * 4
              - 2;
      return { x, y, z };
    }

    const tmp = new THREE.Vector3();
    const tmp2 = new THREE.Vector3();

    function updateDragon(time) {
      // Sample base spine path
      for (let i = 0; i < SPINE_N; i++) {
        const t = i / (SPINE_N - 1);
        const p = spineSample(t, time);
        spine[i].set(p.x, p.y, p.z);
      }

      // Bias the head toward the mouse for subtle tracking
      const headBias = new THREE.Vector3(mouse.x * 6, mouse.y * 4, mouse.x * 1.5);
      // Falloff over the first ~10 segments
      for (let i = 0; i < 12; i++) {
        const w = (1 - i / 12) * 0.7;
        spine[i].x += headBias.x * w;
        spine[i].y += headBias.y * w;
        spine[i].z += headBias.z * w;
      }

      // Apply to meshes + orient toward next-forward joint
      for (let i = 0; i < SPINE_N; i++) {
        const seg = segments[i];
        seg.group.position.copy(spine[i]);
        // Look from this segment toward the previous (forward) one — head looks ahead
        const target = i === 0
          ? tmp.copy(spine[0]).add(tmp2.subVectors(spine[0], spine[1]).normalize())
          : spine[i - 1];
        seg.group.lookAt(target);
      }

      // Mane light follows nape (segment 3)
      maneLight.position.copy(spine[3]);

      rebuildWhisker(whiskerL, -1, time);
      rebuildWhisker(whiskerR,  1, time);
    }

    // ============================================================
    //  Cherry blossom petals (instanced)
    // ============================================================
    const PETAL_COUNT = 260;

    // Petal shape
    const petalShape = new THREE.Shape();
    petalShape.moveTo(0, 0);
    petalShape.bezierCurveTo(0.55, 0.25, 0.55, 0.85, 0, 1.05);
    petalShape.bezierCurveTo(-0.55, 0.85, -0.55, 0.25, 0, 0);
    const petalGeo = new THREE.ShapeGeometry(petalShape, 6);
    petalGeo.translate(0, -0.5, 0);
    petalGeo.scale(0.45, 0.45, 0.45);

    const petalMat = new THREE.MeshStandardMaterial({
      color: COL.PETAL_LIGHT,
      emissive: COL.PETAL_DEEP,
      emissiveIntensity: 0.25,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.95,
      roughness: 0.6,
      metalness: 0.0,
    });

    const petals = new THREE.InstancedMesh(petalGeo, petalMat, PETAL_COUNT);
    petals.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(petals);

    const petalState = [];
    const petalRange = { x: 80, y: 30, zMin: -25, zMax: 18, fallTop: 25, fallBot: -18 };
    const petalDummy = new THREE.Object3D();
    const petalColor = new THREE.Color();

    // Per-instance color tint
    for (let i = 0; i < PETAL_COUNT; i++) {
      const tone = Math.random();
      petalColor.setHex(tone < 0.5 ? COL.PETAL_LIGHT : COL.PETAL_DEEP);
      petalColor.offsetHSL(0, (Math.random() - 0.5) * 0.05, (Math.random() - 0.5) * 0.1);
      petals.setColorAt(i, petalColor);
    }
    if (petals.instanceColor) petals.instanceColor.needsUpdate = true;

    function spawnPetal(reuseIdx) {
      const s = petalState[reuseIdx] || (petalState[reuseIdx] = {});
      s.x = (Math.random() - 0.5) * petalRange.x;
      s.y = petalRange.fallTop + Math.random() * petalRange.y;
      s.z = petalRange.zMin + Math.random() * (petalRange.zMax - petalRange.zMin);
      s.rx = Math.random() * Math.PI * 2;
      s.ry = Math.random() * Math.PI * 2;
      s.rz = Math.random() * Math.PI * 2;
      s.rxv = (Math.random() - 0.5) * 0.6;
      s.ryv = (Math.random() - 0.5) * 1.2;
      s.rzv = (Math.random() - 0.5) * 0.4;
      s.fall = 0.6 + Math.random() * 0.9;
      s.swayPhase = Math.random() * Math.PI * 2;
      s.swayAmp   = 0.4 + Math.random() * 0.9;
      s.scale     = 0.6 + Math.random() * 0.9;
      return s;
    }
    for (let i = 0; i < PETAL_COUNT; i++) {
      spawnPetal(i);
      // Pre-distribute vertically so they're already falling at start
      petalState[i].y = petalRange.fallBot + Math.random() * (petalRange.fallTop - petalRange.fallBot + petalRange.y);
    }

    function updatePetals(dt, time) {
      for (let i = 0; i < PETAL_COUNT; i++) {
        const s = petalState[i];
        s.y -= s.fall * dt;
        s.x += Math.sin(time * 0.7 + s.swayPhase) * s.swayAmp * dt;
        s.z += Math.cos(time * 0.5 + s.swayPhase * 1.3) * s.swayAmp * 0.6 * dt;
        s.rx += s.rxv * dt;
        s.ry += s.ryv * dt;
        s.rz += s.rzv * dt;
        if (s.y < petalRange.fallBot) spawnPetal(i);

        petalDummy.position.set(s.x, s.y, s.z);
        petalDummy.rotation.set(s.rx, s.ry, s.rz);
        petalDummy.scale.setScalar(s.scale);
        petalDummy.updateMatrix();
        petals.setMatrixAt(i, petalDummy.matrix);
      }
      petals.instanceMatrix.needsUpdate = true;
    }

    // ============================================================
    //  God-ray planes (additive, in front of background)
    // ============================================================
    const rayGroup = new THREE.Group();
    scene.add(rayGroup);
    {
      const rayMat = new THREE.MeshBasicMaterial({
        color: 0xffd9a8, transparent: true, opacity: 0.06,
        blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
      });
      for (let i = 0; i < 6; i++) {
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(7, 90), rayMat.clone());
        plane.material.opacity = 0.04 + Math.random() * 0.07;
        plane.position.set(8 + i * 2.4 + Math.random() * 1.5, 18, -30 - i * 2);
        plane.rotation.z = -0.55 + (Math.random() - 0.5) * 0.06;
        plane.userData.basePos = plane.position.clone();
        rayGroup.add(plane);
      }
    }

    // ============================================================
    //  Mouse + parallax
    // ============================================================
    const cursorEl = document.getElementById('cursor');
    addEventListener('pointermove', (e) => {
      mouse.tx = (e.clientX / innerWidth)  * 2 - 1;
      mouse.ty = -((e.clientY / innerHeight) * 2 - 1);
      cursorEl.style.left = e.clientX + 'px';
      cursorEl.style.top  = e.clientY + 'px';
    }, { passive: true });
    addEventListener('pointerleave', () => { mouse.tx = 0; mouse.ty = 0; });

    // ============================================================
    //  Resize
    // ============================================================
    addEventListener('resize', () => {
      const w = innerWidth, h = innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bloom.setSize(w, h);
      bgUniforms.uResolution.value.set(w, h);
    });

    // ============================================================
    //  Postprocessing
    // ============================================================
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.6, 0.18);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    // ============================================================
    //  Loop
    // ============================================================
    const clock = new THREE.Clock();
    let time = 0;

    function tick() {
      requestAnimationFrame(tick);
      const dt = Math.min(clock.getDelta(), 1/30);
      time += dt;

      // Smooth mouse
      mouse.x += (mouse.tx - mouse.x) * Math.min(1, dt * 5);
      mouse.y += (mouse.ty - mouse.y) * Math.min(1, dt * 5);
      bgUniforms.uTime.value = time;
      bgUniforms.uMouse.value.set(mouse.x, mouse.y);

      // Parallax on mountain layers (deeper = less movement)
      mountainsFar.position.x  = -mouse.x * 1.0;
      mountainsFar.position.y  = -10 - mouse.y * 0.8;
      mountainsMid.position.x  = -mouse.x * 2.4;
      mountainsMid.position.y  = -10 - mouse.y * 1.6;
      mountainsNear.position.x = -mouse.x * 4.5;
      mountainsNear.position.y = -10 - mouse.y * 2.8;

      // Mist drift
      for (const m of mistGroup.children) {
        const u = m.userData;
        m.position.x = u.baseX + Math.sin(time * 0.15 + u.driftPhase) * 8 - mouse.x * 3;
        m.position.y += Math.sin(time * 0.4 + u.driftPhase) * 0.01;
      }

      // God rays gentle sway
      for (const r of rayGroup.children) {
        r.position.x = r.userData.basePos.x + Math.sin(time * 0.3 + r.position.z) * 0.3 - mouse.x * 0.6;
        r.material.opacity = (0.04 + 0.04 * (0.5 + 0.5 * Math.sin(time * 0.6 + r.position.z))) ;
      }

      // Camera parallax
      camera.position.x = mouse.x * 1.6;
      camera.position.y = 2 + mouse.y * 1.0;
      camera.lookAt(mouse.x * 0.5, 2 + mouse.y * 0.5, 0);

      updateDragon(time);
      updatePetals(dt, time);

      composer.render();
    }
    tick();
  </script>
</body>
</html>
