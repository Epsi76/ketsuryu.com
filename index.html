<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KetsuRyu</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- Scene / Camera / Renderer ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 0, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // ---------- Petal geometry (Bezier shape) ----------
    const petalShape = new THREE.Shape();
    petalShape.moveTo(0, 0);
    petalShape.bezierCurveTo(0.55, 0.25, 0.55, 0.85, 0, 1.05);
    petalShape.bezierCurveTo(-0.55, 0.85, -0.55, 0.25, 0, 0);
    const petalGeo = new THREE.ShapeGeometry(petalShape, 8);
    petalGeo.translate(0, -0.5, 0);
    petalGeo.scale(0.5, 0.5, 0.5);

    // ---------- Three parallax layers ----------
    // Each layer: { group, instMesh, state[], factor, fall, count, sizeMul, opacity, zRange }
    const layers = [
      { factor: 0.8,  count: 70,  fall: [0.4, 0.8], size: [0.7, 1.2],  opacity: 0.55, zRange: [-30, -18] }, // far
      { factor: 1.6,  count: 90,  fall: [0.6, 1.1], size: [0.9, 1.4],  opacity: 0.85, zRange: [-15,  -3] }, // mid
      { factor: 3.2,  count: 60,  fall: [0.9, 1.5], size: [1.2, 1.9],  opacity: 1.00, zRange: [  0,  10] }, // near
    ];

    const COLOR_LIGHT = new THREE.Color(0xffd1de);
    const COLOR_DEEP  = new THREE.Color(0xff8aa8);

    const dummy = new THREE.Object3D();
    const tmpColor = new THREE.Color();

    for (const layer of layers) {
      const mat = new THREE.MeshBasicMaterial({
        color: 0xffffff,                    // tinted via instanceColor
        side: THREE.DoubleSide,
        transparent: true,
        opacity: layer.opacity,
        depthWrite: false,
      });
      const inst = new THREE.InstancedMesh(petalGeo, mat, layer.count);
      inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      // Per-layer group for parallax
      const group = new THREE.Group();
      group.add(inst);
      scene.add(group);

      const state = [];
      for (let i = 0; i < layer.count; i++) {
        const s = {
          x: (Math.random() - 0.5) * 60,
          y: -15 + Math.random() * 35,             // pre-distribute vertically
          z: layer.zRange[0] + Math.random() * (layer.zRange[1] - layer.zRange[0]),
          rx: Math.random() * Math.PI * 2,
          ry: Math.random() * Math.PI * 2,
          rz: Math.random() * Math.PI * 2,
          rxv: (Math.random() - 0.5) * 0.5,
          ryv: (Math.random() - 0.5) * 1.0,
          rzv: (Math.random() - 0.5) * 0.4,
          fall: layer.fall[0] + Math.random() * (layer.fall[1] - layer.fall[0]),
          swayPhase: Math.random() * Math.PI * 2,
          swayAmp: 0.5 + Math.random() * 0.9,
          scale: layer.size[0] + Math.random() * (layer.size[1] - layer.size[0]),
        };
        state.push(s);

        // Per-instance color tint
        tmpColor.copy(COLOR_LIGHT).lerp(COLOR_DEEP, Math.random());
        tmpColor.offsetHSL(0, (Math.random() - 0.5) * 0.06, (Math.random() - 0.5) * 0.08);
        inst.setColorAt(i, tmpColor);
      }
      if (inst.instanceColor) inst.instanceColor.needsUpdate = true;

      layer.group = group;
      layer.inst  = inst;
      layer.state = state;
    }

    // ---------- Mouse + parallax ----------
    const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
    addEventListener('pointermove', (e) => {
      mouse.tx = (e.clientX / innerWidth)  * 2 - 1;
      mouse.ty = -((e.clientY / innerHeight) * 2 - 1);
    }, { passive: true });
    addEventListener('pointerleave', () => { mouse.tx = 0; mouse.ty = 0; });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---------- Click → dragon head apparition ----------
    // Pool of ghost dragon heads. Each: dark head + horns lit by warm
    // PointLights at the eye sockets, glowing eye spheres, additive halos.
    // Fades in, holds, recedes and fades out.
    const GHOST_COUNT = 5;
    const ghostPool = [];

    function buildGhost() {
      const g = new THREE.Group();

      // Head silhouette — dark, lit by the inner eye lights so it reads as
      // a faintly suggested mass rather than an explicit object.
      const headMat = new THREE.MeshStandardMaterial({
        color: 0x05070a,
        roughness: 0.85, metalness: 0.1,
        transparent: true, opacity: 0,
        depthWrite: false,
      });
      const head = new THREE.Mesh(new THREE.SphereGeometry(1.2, 28, 20), headMat);
      head.scale.set(1.15, 0.95, 1.45);
      g.add(head);

      // Snout
      const snout = new THREE.Mesh(new THREE.SphereGeometry(0.65, 18, 14), headMat);
      snout.scale.set(0.85, 0.7, 1.05);
      snout.position.set(0, -0.1, -1.1);
      g.add(snout);

      // Brow ridges
      for (const sx of [-1, 1]) {
        const brow = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.12, 0.32), headMat);
        brow.position.set(sx * 0.45, 0.55, -0.55);
        brow.rotation.z = sx * -0.25;
        g.add(brow);
      }

      // Horns (small, suggested)
      const hornMat = new THREE.MeshStandardMaterial({
        color: 0x06060a, roughness: 0.6, metalness: 0.3,
        transparent: true, opacity: 0,
        depthWrite: false,
      });
      for (const sx of [-1, 1]) {
        const horn = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.85, 8), hornMat);
        horn.position.set(sx * 0.45, 1.0, 0.0);
        horn.rotation.z = sx * -0.32;
        horn.rotation.x = -0.3;
        g.add(horn);
      }

      // Whisker hint — short curved tubes flowing back
      const whiskerMat = new THREE.MeshStandardMaterial({
        color: 0x0a0608, roughness: 0.7,
        transparent: true, opacity: 0,
        depthWrite: false,
      });
      for (const sx of [-1, 1]) {
        const pts = [];
        for (let i = 0; i <= 12; i++) {
          const u = i / 12;
          pts.push(new THREE.Vector3(
            sx * (0.35 + u * 0.6),
            -0.3 - u * 0.6,
            -1.1 - u * 1.5,
          ));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.04, 5, false), whiskerMat);
        g.add(tube);
      }

      // Glowing eyes (golden)
      const eyeMat = new THREE.MeshBasicMaterial({
        color: 0xffd870, transparent: true, opacity: 0, depthWrite: false,
      });
      const eyes = [];
      for (const sx of [-1, 1]) {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.18, 14, 12), eyeMat.clone());
        eye.position.set(sx * 0.46, 0.32, -0.78);
        g.add(eye);
        eyes.push(eye);
      }

      // Slit pupils (visible only when bright)
      const pupMat = new THREE.MeshBasicMaterial({
        color: 0x100804, transparent: true, opacity: 0, depthWrite: false,
      });
      const pups = [];
      for (const sx of [-1, 1]) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.18, 0.04), pupMat.clone());
        p.position.set(sx * 0.46, 0.32, -0.92);
        g.add(p);
        pups.push(p);
      }

      // Additive warm halos behind eyes
      function makeHalo() {
        const cv = document.createElement('canvas');
        cv.width = cv.height = 128;
        const cx = cv.getContext('2d');
        const grd = cx.createRadialGradient(64, 64, 4, 64, 64, 60);
        grd.addColorStop(0.0,  'rgba(255, 200, 120, 1)');
        grd.addColorStop(0.35, 'rgba(255, 130,  60, 0.5)');
        grd.addColorStop(1.0,  'rgba(255, 100,  40, 0)');
        cx.fillStyle = grd;
        cx.fillRect(0, 0, 128, 128);
        return new THREE.CanvasTexture(cv);
      }
      const haloTex = makeHalo();
      const halos = [];
      for (const sx of [-1, 1]) {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: haloTex,
          color: 0xffb070,
          transparent: true, opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        }));
        sprite.scale.set(2.4, 2.4, 1);
        sprite.position.set(sx * 0.46, 0.32, -0.85);
        g.add(sprite);
        halos.push(sprite);
      }

      // Warm point light at the eyes — illuminates head, falls off fast
      const eyeLight = new THREE.PointLight(0xff9a4a, 0, 6, 1.8);
      eyeLight.position.set(0, 0.25, -0.6);
      g.add(eyeLight);

      g.userData = {
        active: false, t: 0, duration: 2.4,
        peakLight: 3.5,
        recede: new THREE.Vector3(),
        materials: [headMat, hornMat, whiskerMat],
        eyes, pups, halos, eyeLight,
      };
      g.visible = false;
      return g;
    }

    for (let i = 0; i < GHOST_COUNT; i++) {
      const g = buildGhost();
      scene.add(g);
      ghostPool.push(g);
    }

    function spawnGhostAt(worldPos) {
      // Pick first inactive, otherwise oldest (smallest remaining time)
      let g = ghostPool.find(g => !g.userData.active);
      if (!g) {
        g = ghostPool.reduce((a, b) => a.userData.t > b.userData.t ? a : b);
      }
      g.position.copy(worldPos);
      g.rotation.set(
        (Math.random() - 0.5) * 0.25,
        (Math.random() - 0.5) * 0.55,
        (Math.random() - 0.5) * 0.18,
      );
      const s = 0.55 + Math.random() * 0.35;
      g.scale.setScalar(s);
      // Recede direction: backward in Z + slight up/random lateral drift
      g.userData.recede.set(
        (Math.random() - 0.5) * 0.4,
        0.4 + Math.random() * 0.4,
        -1.2 - Math.random() * 0.8,
      );
      g.userData.t = 0;
      g.userData.active = true;
      g.visible = true;
    }

    function updateGhosts(dt) {
      for (const g of ghostPool) {
        if (!g.userData.active) continue;
        const u = g.userData;
        u.t += dt;
        const k = u.t / u.duration;
        if (k >= 1) { u.active = false; g.visible = false; u.eyeLight.intensity = 0; continue; }

        // Alpha curve: quick fade-in, brief hold, slower fade-out
        let a;
        if      (k < 0.18) a = k / 0.18;
        else if (k < 0.55) a = 1.0;
        else               a = 1.0 - (k - 0.55) / 0.45;
        a = Math.max(0, Math.min(1, a));

        // Apply per-part opacities
        for (const m of u.materials) m.opacity = a * 0.78;
        for (const eye of u.eyes)    eye.material.opacity = a;
        for (const pup of u.pups)    pup.material.opacity = a;
        for (const h of u.halos)     h.material.opacity   = a * 0.85;
        u.eyeLight.intensity = a * u.peakLight;

        // Subtle drift away — eyes recede backward as they fade
        g.position.addScaledVector(u.recede, dt * 0.45);
        // Gentle scale-up while fading out for ethereal feel
        const sBase = g.scale.x;
        const sNew = sBase * (1 + dt * 0.04 * (k > 0.55 ? 1 : 0.2));
        g.scale.setScalar(sNew);
      }
    }

    // Project click to a world plane in front of the camera (z = 2)
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    const clickPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -2);
    const hit = new THREE.Vector3();

    addEventListener('pointerdown', (e) => {
      ndc.x = (e.clientX / innerWidth)  * 2 - 1;
      ndc.y = -((e.clientY / innerHeight) * 2 - 1);
      raycaster.setFromCamera(ndc, camera);
      if (raycaster.ray.intersectPlane(clickPlane, hit)) {
        spawnGhostAt(hit);
      }
    });

    // ---------- Loop ----------
    const clock = new THREE.Clock();
    let time = 0;
    const Y_TOP = 22, Y_BOT = -18;

    function tick() {
      requestAnimationFrame(tick);
      const dt = Math.min(clock.getDelta(), 1/30);
      time += dt;

      // Smooth mouse
      mouse.x += (mouse.tx - mouse.x) * Math.min(1, dt * 4);
      mouse.y += (mouse.ty - mouse.y) * Math.min(1, dt * 4);

      // Parallax: shift each layer opposite to the mouse, deeper = subtler
      for (const layer of layers) {
        layer.group.position.x = -mouse.x * layer.factor;
        layer.group.position.y = -mouse.y * layer.factor * 0.6;

        const st = layer.state;
        for (let i = 0; i < st.length; i++) {
          const s = st[i];
          s.y -= s.fall * dt;
          s.x += Math.sin(time * 0.7 + s.swayPhase) * s.swayAmp * dt;
          s.z += Math.cos(time * 0.5 + s.swayPhase * 1.3) * s.swayAmp * 0.4 * dt;
          s.rx += s.rxv * dt;
          s.ry += s.ryv * dt;
          s.rz += s.rzv * dt;

          if (s.y < Y_BOT) {
            s.y = Y_TOP + Math.random() * 6;
            s.x = (Math.random() - 0.5) * 60;
          }

          dummy.position.set(s.x, s.y, s.z);
          dummy.rotation.set(s.rx, s.ry, s.rz);
          dummy.scale.setScalar(s.scale);
          dummy.updateMatrix();
          layer.inst.setMatrixAt(i, dummy.matrix);
        }
        layer.inst.instanceMatrix.needsUpdate = true;
      }

      // Subtle camera parallax for extra depth feel
      camera.position.x = mouse.x * 0.6;
      camera.position.y = mouse.y * 0.4;
      camera.lookAt(0, 0, 0);

      updateGhosts(dt);

      renderer.render(scene, camera);
    }
    tick();
  </script>
</body>
</html>
