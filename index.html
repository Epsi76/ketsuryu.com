<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KetsuRyu</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- Scene / Camera / Renderer ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 0, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // ---------- Petal geometry (Bezier shape) ----------
    const petalShape = new THREE.Shape();
    petalShape.moveTo(0, 0);
    petalShape.bezierCurveTo(0.55, 0.25, 0.55, 0.85, 0, 1.05);
    petalShape.bezierCurveTo(-0.55, 0.85, -0.55, 0.25, 0, 0);
    const petalGeo = new THREE.ShapeGeometry(petalShape, 8);
    petalGeo.translate(0, -0.5, 0);
    petalGeo.scale(0.5, 0.5, 0.5);

    // ---------- Three parallax layers ----------
    // Each layer: { group, instMesh, state[], factor, fall, count, sizeMul, opacity, zRange }
    const layers = [
      { factor: 0.8,  count: 70,  fall: [0.4, 0.8], size: [0.7, 1.2],  opacity: 0.55, zRange: [-30, -18] }, // far
      { factor: 1.6,  count: 90,  fall: [0.6, 1.1], size: [0.9, 1.4],  opacity: 0.85, zRange: [-15,  -3] }, // mid
      { factor: 3.2,  count: 60,  fall: [0.9, 1.5], size: [1.2, 1.9],  opacity: 1.00, zRange: [  0,  10] }, // near
    ];

    const COLOR_LIGHT = new THREE.Color(0xffd1de);
    const COLOR_DEEP  = new THREE.Color(0xff8aa8);

    const dummy = new THREE.Object3D();
    const tmpColor = new THREE.Color();

    for (const layer of layers) {
      const mat = new THREE.MeshBasicMaterial({
        color: 0xffffff,                    // tinted via instanceColor
        side: THREE.DoubleSide,
        transparent: true,
        opacity: layer.opacity,
        depthWrite: false,
      });
      const inst = new THREE.InstancedMesh(petalGeo, mat, layer.count);
      inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      // Per-layer group for parallax
      const group = new THREE.Group();
      group.add(inst);
      scene.add(group);

      const state = [];
      for (let i = 0; i < layer.count; i++) {
        const s = {
          x: (Math.random() - 0.5) * 60,
          y: -15 + Math.random() * 35,             // pre-distribute vertically
          z: layer.zRange[0] + Math.random() * (layer.zRange[1] - layer.zRange[0]),
          rx: Math.random() * Math.PI * 2,
          ry: Math.random() * Math.PI * 2,
          rz: Math.random() * Math.PI * 2,
          rxv: (Math.random() - 0.5) * 0.5,
          ryv: (Math.random() - 0.5) * 1.0,
          rzv: (Math.random() - 0.5) * 0.4,
          fall: layer.fall[0] + Math.random() * (layer.fall[1] - layer.fall[0]),
          swayPhase: Math.random() * Math.PI * 2,
          swayAmp: 0.5 + Math.random() * 0.9,
          scale: layer.size[0] + Math.random() * (layer.size[1] - layer.size[0]),
        };
        state.push(s);

        // Per-instance color tint
        tmpColor.copy(COLOR_LIGHT).lerp(COLOR_DEEP, Math.random());
        tmpColor.offsetHSL(0, (Math.random() - 0.5) * 0.06, (Math.random() - 0.5) * 0.08);
        inst.setColorAt(i, tmpColor);
      }
      if (inst.instanceColor) inst.instanceColor.needsUpdate = true;

      layer.group = group;
      layer.inst  = inst;
      layer.state = state;
    }

    // ---------- Click dragon (eyes + ethereal cyan smoke) ----------
    const dragonGroup = new THREE.Group();
    dragonGroup.visible = false;
    dragonGroup.scale.setScalar(0.35);
    scene.add(dragonGroup);

    // Curl-noise smoke plane
    const smokeMat = new THREE.ShaderMaterial({
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      uniforms: {
        uTime:      { value: 0 },
        uIntensity: { value: 0 },
        uSeed:      { value: 0 },
        uColor:     { value: new THREE.Color(0x5fecec) },
        uColorHot:  { value: new THREE.Color(0xb8fff5) },
      },
      vertexShader: /*glsl*/`
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
      `,
      fragmentShader: /*glsl*/`
        precision highp float;
        varying vec2 vUv;
        uniform float uTime;
        uniform float uIntensity;
        uniform float uSeed;
        uniform vec3  uColor;
        uniform vec3  uColorHot;

        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float vnoise(vec2 p){
          vec2 i = floor(p), f = fract(p);
          float a = hash(i), b = hash(i + vec2(1,0));
          float c = hash(i + vec2(0,1)), d = hash(i + vec2(1,1));
          vec2 u = f*f*(3.0-2.0*f);
          return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
        }
        float fbm(vec2 p){ float v=0.0,a=0.55; for(int i=0;i<6;i++){ v+=a*vnoise(p); p*=2.05; a*=0.5; } return v; }

        void main() {
          vec2 uv = vUv - 0.5;
          float r = length(uv) * 2.0;

          vec2 sd = vec2(uSeed, -uSeed * 0.7);
          // Domain-warped FBM for curling tendrils
          vec2 q = vec2(
            fbm(uv * 2.4 + sd + vec2( uTime * 0.16, -uTime * 0.10)),
            fbm(uv * 2.4 + sd + vec2(-uTime * 0.12,  uTime * 0.20) + 5.2)
          );
          float n = fbm(uv * 5.5 + q * 2.2 - vec2(uTime * 0.08, 0.0));
          n = pow(max(n, 0.0), 1.55) * 1.9;

          // Angular tendrils
          float ang = atan(uv.y, uv.x);
          float tendrils = 0.5 + 0.5 * sin(ang * (4.0 + uSeed * 2.0) + n * 6.0 + uTime * 0.35);
          n *= 0.55 + 0.65 * tendrils;

          // Radial mask: thicker around eyes, fades at edge AND in the very center
          float outer  = smoothstep(1.0, 0.18, r);
          float center = 1.0 - exp(-pow(r * 4.0, 2.0));
          float mask   = outer * mix(0.35, 1.0, center);

          // Bright core where smoke is densest
          vec3 col = mix(uColor, uColorHot, smoothstep(0.3, 0.95, n));
          float alpha = clamp(n * mask * uIntensity, 0.0, 1.0);

          gl_FragColor = vec4(col * (alpha + 0.15), alpha);
        }
      `,
    });
    const smokePlane = new THREE.Mesh(new THREE.PlaneGeometry(11, 11), smokeMat);
    dragonGroup.add(smokePlane);

    // Eye shader (almond iris + slit pupil + glow + spec)
    const eyeUniforms = {
      uTime:    { value: 0 },
      uOpacity: { value: 0 },
    };
    const eyeMat = new THREE.ShaderMaterial({
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      uniforms: eyeUniforms,
      vertexShader: /*glsl*/`
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
      `,
      fragmentShader: /*glsl*/`
        precision highp float;
        varying vec2 vUv;
        uniform float uOpacity;
        uniform float uTime;

        void main() {
          vec2 uv = vUv - 0.5;

          // Outer warm glow halo
          float halo = exp(-length(uv) * 4.5) * 0.75;

          // Almond iris
          vec2 alm = uv * vec2(1.0, 1.85);
          float irisD = length(alm);
          float iris  = smoothstep(0.45, 0.40, irisD);
          float irisInner = smoothstep(0.40, 0.10, irisD);

          // Vertical slit pupil with slight breathing
          float breath = 1.0 + 0.04 * sin(uTime * 1.6);
          vec2 pup = uv * vec2(8.0 * breath, 1.5);
          float pupil = smoothstep(0.30, 0.26, length(pup));

          // Specular dot near top
          float spec = smoothstep(0.075, 0.05, length(uv - vec2(0.10, 0.12)));

          vec3 hot    = vec3(1.00, 0.55, 0.20);
          vec3 amber  = vec3(1.00, 0.86, 0.45);
          vec3 yellow = vec3(1.00, 0.97, 0.70);
          vec3 col = mix(hot, amber, iris);
          col = mix(col, yellow, irisInner * 0.7);
          col = mix(col, vec3(0.01), pupil);
          col += vec3(1.0) * spec * (1.0 - pupil) * 0.9;

          float alpha = max(iris * 0.95, halo);
          alpha = mix(alpha, alpha * 0.30, pupil);
          alpha *= uOpacity;

          gl_FragColor = vec4(col * (alpha + 0.25), alpha);
        }
      `,
    });

    // Each eye is wrapped in a tilted group so the outer corner sits higher
    // and the inner corner drops toward the snout — classic dragon glare.
    const eyeGeo = new THREE.PlaneGeometry(1.7, 1.2);
    function makeEye(side) {
      const wrap = new THREE.Group();
      const mesh = new THREE.Mesh(eyeGeo, eyeMat);
      if (side > 0) mesh.scale.x = -1;       // mirror right eye for symmetric highlight
      wrap.add(mesh);
      wrap.position.set(side * 1.05, 0, 0.02);
      wrap.rotation.z = side * -0.42;        // outer corner up, inner corner down
      return wrap;
    }
    dragonGroup.add(makeEye(-1));
    dragonGroup.add(makeEye( 1));

    const dragon = {
      active:   false,
      age:      0,
      lifetime: 6.0,
      fadeIn:   1.6,
      fadeOut:  1.8,
      seed:     0,
    };

    // Click → spawn / replace
    const raycaster  = new THREE.Raycaster();
    const clickPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const clickPoint = new THREE.Vector3();
    const ndc        = new THREE.Vector2();

    addEventListener('pointerdown', (e) => {
      ndc.x =  (e.clientX / innerWidth)  * 2 - 1;
      ndc.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      if (!raycaster.ray.intersectPlane(clickPlane, clickPoint)) return;
      dragonGroup.position.copy(clickPoint);
      dragonGroup.visible = true;
      dragon.active = true;
      dragon.age    = 0;
      dragon.seed   = Math.random() * 100;
      smokeMat.uniforms.uSeed.value = dragon.seed;
      smokePlane.rotation.z = Math.random() * Math.PI * 2;
    });

    function updateDragon(dt) {
      if (!dragon.active) return;
      dragon.age += dt;
      let intensity;
      if (dragon.age < dragon.fadeIn) {
        intensity = dragon.age / dragon.fadeIn;
        intensity = intensity * intensity * (3 - 2 * intensity); // smoothstep
      } else if (dragon.age < dragon.lifetime - dragon.fadeOut) {
        intensity = 1.0;
      } else if (dragon.age < dragon.lifetime) {
        const t = (dragon.lifetime - dragon.age) / dragon.fadeOut;
        intensity = t * t * (3 - 2 * t);
      } else {
        dragon.active = false;
        dragonGroup.visible = false;
        return;
      }
      smokeMat.uniforms.uIntensity.value = intensity;
      smokeMat.uniforms.uTime.value      = dragon.age;
      // Eyes appear a touch later than the smoke and fade out a touch earlier
      const eyePhase = Math.max(0, Math.min(1, (dragon.age - 0.4) / dragon.fadeIn));
      const eyeFade  = dragon.age > dragon.lifetime - dragon.fadeOut * 1.2
        ? Math.max(0, (dragon.lifetime - dragon.age) / (dragon.fadeOut * 1.2))
        : 1;
      eyeUniforms.uOpacity.value = Math.min(eyePhase, eyeFade);
      eyeUniforms.uTime.value    = dragon.age;
      // Gentle rotation/wobble of the smoke layer
      smokePlane.rotation.z += dt * 0.05;
    }

    // ---------- Mouse + parallax ----------
    const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
    addEventListener('pointermove', (e) => {
      mouse.tx = (e.clientX / innerWidth)  * 2 - 1;
      mouse.ty = -((e.clientY / innerHeight) * 2 - 1);
    }, { passive: true });
    addEventListener('pointerleave', () => { mouse.tx = 0; mouse.ty = 0; });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---------- Loop ----------
    const clock = new THREE.Clock();
    let time = 0;
    const Y_TOP = 22, Y_BOT = -18;

    function tick() {
      requestAnimationFrame(tick);
      const dt = Math.min(clock.getDelta(), 1/30);
      time += dt;

      // Smooth mouse
      mouse.x += (mouse.tx - mouse.x) * Math.min(1, dt * 4);
      mouse.y += (mouse.ty - mouse.y) * Math.min(1, dt * 4);

      // Parallax: shift each layer opposite to the mouse, deeper = subtler
      for (const layer of layers) {
        layer.group.position.x = -mouse.x * layer.factor;
        layer.group.position.y = -mouse.y * layer.factor * 0.6;

        const st = layer.state;
        for (let i = 0; i < st.length; i++) {
          const s = st[i];
          s.y -= s.fall * dt;
          s.x += Math.sin(time * 0.7 + s.swayPhase) * s.swayAmp * dt;
          s.z += Math.cos(time * 0.5 + s.swayPhase * 1.3) * s.swayAmp * 0.4 * dt;
          s.rx += s.rxv * dt;
          s.ry += s.ryv * dt;
          s.rz += s.rzv * dt;

          if (s.y < Y_BOT) {
            s.y = Y_TOP + Math.random() * 6;
            s.x = (Math.random() - 0.5) * 60;
          }

          dummy.position.set(s.x, s.y, s.z);
          dummy.rotation.set(s.rx, s.ry, s.rz);
          dummy.scale.setScalar(s.scale);
          dummy.updateMatrix();
          layer.inst.setMatrixAt(i, dummy.matrix);
        }
        layer.inst.instanceMatrix.needsUpdate = true;
      }

      // Subtle camera parallax for extra depth feel
      camera.position.x = mouse.x * 0.6;
      camera.position.y = mouse.y * 0.4;
      camera.lookAt(0, 0, 0);

      updateDragon(dt);

      renderer.render(scene, camera);
    }
    tick();
  </script>
</body>
</html>
