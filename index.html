<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KetsuRyu — Enter the Dragon</title>
  <meta name="description" content="Une fenêtre de calme pour le deep-work et la détente : pétales de sakura, crépuscule paisible, ambiance sonore et sagesses d'Asie. À mettre en plein écran." />
  <link rel="canonical" href="https://ketsuryu.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ketsuryu.com/" />
  <meta property="og:title" content="KetsuRyu — Enter the Dragon" />
  <meta property="og:description" content="Une fenêtre de calme pour le deep-work et la détente : pétales de sakura, crépuscule paisible, ambiance sonore et sagesses d'Asie. À mettre en plein écran." />
  <meta property="og:image" content="https://ketsuryu.com/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="mask-icon" href="/favicon.svg" color="#e6729d" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0b0b0d" />
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas { display: block; }
    .petals-canvas {
      opacity: 0;
      transition: opacity 3s ease;
      will-change: opacity;
    }
    .petals-canvas.loaded { opacity: 1; }
    #bg-video {
      position: fixed;
      top: -2vh;
      left: -2vw;
      width: 104vw;
      height: 104vh;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      --px: 0;
      --py: 0;
      transform: translate3d(calc(var(--px) * 2vw), calc(var(--py) * 2vh), 0);
      transition: opacity 5s ease;
      will-change: transform, opacity;
    }
    #bg-video.loaded { opacity: 0.6; }
    /* Keep the moon (right side of the frame) on screen when the viewport
       narrows past landscape — slides the crop window toward the right. */
    @media (max-aspect-ratio: 1/1) {
      #bg-video { object-position: 65% center; }
    }
    @media (max-aspect-ratio: 3/5) {
      #bg-video { object-position: 80% center; }
    }
    #fs-btn {
      position: fixed;
      right: 14px;
      bottom: 14px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: rgba(0, 0, 0, 0.35);
      color: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.25s ease, background 0.2s ease, color 0.2s ease;
      animation: ui-fade-in 3s ease backwards;
      z-index: 10;
    }
    #fs-btn:hover, #fs-btn:focus-visible {
      opacity: 1;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      outline: none;
    }
    #fs-btn svg { display: block; }

    /* Minimal audio controls — mirror of #fs-btn, anchored bottom-left */
    #audio-ctrl {
      position: fixed;
      left: 14px;
      bottom: 14px;
      display: flex;
      gap: 6px;
      opacity: 0.45;
      transition: opacity 0.25s ease;
      visibility: hidden;          /* stays hidden until the playlist is known */
      z-index: 10;
    }
    #audio-ctrl.ready {
      visibility: visible;
      animation: ui-fade-in 3s ease backwards;
    }
    #audio-ctrl:hover, #audio-ctrl:focus-within { opacity: 1; }
    #audio-ctrl button {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: rgba(0, 0, 0, 0.35);
      color: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    #audio-ctrl button:hover, #audio-ctrl button:focus-visible {
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      outline: none;
    }
    #audio-ctrl svg { display: block; fill: currentColor; }
    /* Gentle "there's music" hint on the play button until the first interaction */
    #audio-ctrl.hint { opacity: 0.6; }
    #audio-ctrl.hint #au-toggle { animation: au-pulse 2.4s ease-in-out infinite; }
    @keyframes au-pulse {
      0%   { box-shadow: 0 0 0 0   rgba(255, 255, 255, 0.28); }
      70%  { box-shadow: 0 0 0 8px rgba(255, 255, 255, 0); }
      100% { box-shadow: 0 0 0 0   rgba(255, 255, 255, 0); }
    }
    @keyframes ui-fade-in { from { opacity: 0; } }
    /* prev/next only make sense with 2+ tracks (.multi added once the playlist is known) */
    #audio-ctrl:not(.multi) #au-prev,
    #audio-ctrl:not(.multi) #au-next { display: none; }
    @media (prefers-reduced-motion: reduce) {
      #fs-btn, #audio-ctrl.ready { animation: none; }
      #audio-ctrl.hint #au-toggle { animation: none; }
    }
    body.is-fs #audio-ctrl {
      opacity: 0;
      pointer-events: none;
    }
    body.is-fs #audio-ctrl.reveal {
      opacity: 0.85;
      pointer-events: auto;
    }
    body.is-fs #audio-ctrl.reveal:hover {
      opacity: 1;
    }
    /* Hidden YouTube player (we only want its audio) — kept off-screen but still
       rendered (not display:none / visibility:hidden) so the browser will play it. */
    #yt-player {
      position: fixed;
      left: -9999px;
      bottom: 0;
      width: 200px;
      height: 120px;
      border: 0;
      pointer-events: none;
    }

    #quote {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(94vw, 1400px);
      text-align: center;
      color: rgba(255, 240, 245, 0.93);
      font-family: 'Georgia', 'Hiragino Mincho ProN', 'Yu Mincho', 'Times New Roman', serif;
      font-size: clamp(15px, 2.1vw, 24px);
      line-height: 1.55;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.75), 0 0 28px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      user-select: none;
      opacity: 0;
      filter: blur(16px);
      transition: opacity 1.8s ease, filter 1.8s ease;
      z-index: 5;
    }
    #quote.visible {
      opacity: 1;
      filter: blur(0);
    }
    #quote .text {
      display: block;
      font-style: italic;
    }
    #quote .author {
      display: block;
      margin-top: 0.7em;
      font-size: 0.78em;
      font-style: normal;
      color: rgba(255, 200, 215, 0.72);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    /* In fullscreen: hidden by default, revealed only when hovering the bottom-right 30% zone */
    body.is-fs #fs-btn {
      opacity: 0;
      pointer-events: none;
    }
    body.is-fs #fs-btn.reveal {
      opacity: 0.85;
      pointer-events: auto;
    }
    body.is-fs #fs-btn.reveal:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <video id="bg-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="ketsuryu.mp4" type="video/mp4" />
  </video>

  <div id="quote" aria-hidden="true">
    <span class="text"></span>
    <span class="author"></span>
  </div>

  <button id="fs-btn" type="button" aria-label="Plein écran" title="Plein écran (double-clic ou Échap pour quitter)">
    <svg id="fs-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
    </svg>
  </button>

  <div id="audio-ctrl">
    <button id="au-prev" type="button" aria-label="Piste précédente" title="Piste précédente">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5.4" y="6" width="2.4" height="12" rx="0.6"/><path d="M20 6.3 L9.4 12 L20 17.7 Z"/></svg>
    </button>
    <button id="au-toggle" type="button" aria-label="Lecture" title="Lecture / Pause">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 5 L20 12 L7 19 Z"/></svg>
    </button>
    <button id="au-next" type="button" aria-label="Piste suivante" title="Piste suivante">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6.3 L14.6 12 L4 17.7 Z"/><rect x="16.2" y="6" width="2.4" height="12" rx="0.6"/></svg>
    </button>
  </div>
  <audio id="bg-audio" preload="none"></audio>
  <div id="yt-player" aria-hidden="true"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- Scene / Camera / Renderer ----------
    const scene = new THREE.Scene();
    scene.background = null; // both renderers use transparent clear; body bg shows through

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 0, 20);

    // Two transparent canvases so the quote overlay can sit between them:
    //   rendererBack  (z-index 0)  → far + mid layers (behind the text)
    //   #quote        (z-index 5)
    //   rendererFront (z-index 6)  → near layer only (in front of the text)
    function makeRenderer(zIndex) {
      const r = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      r.setPixelRatio(Math.min(devicePixelRatio, 2));
      r.setSize(innerWidth, innerHeight);
      r.setClearColor(0x000000, 0);
      const el = r.domElement;
      el.style.position = 'fixed';
      el.style.inset = '0';
      el.style.zIndex = String(zIndex);
      el.style.pointerEvents = 'none';
      el.classList.add('petals-canvas');
      document.body.appendChild(el);
      return r;
    }
    const rendererBack  = makeRenderer(1);
    const rendererFront = makeRenderer(6);

    // Fade petal canvases in (slower than UI, faster than the 5s bg-video).
    // Double rAF so the initial opacity:0 paints before the transition.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      rendererBack.domElement.classList.add('loaded');
      rendererFront.domElement.classList.add('loaded');
    }));

    // ---------- Background video: fade-in + mouse-driven parallax ----------
    const bgVideo = document.getElementById('bg-video');
    const revealVideo = () => bgVideo.classList.add('loaded');
    // Reveal as soon as we have any frame data; cover the case where the
    // event already fired before this module script ran (mobile, preload).
    if (bgVideo.readyState >= 2) {
      revealVideo();
    } else {
      bgVideo.addEventListener('loadeddata', revealVideo, { once: true });
      bgVideo.addEventListener('canplay',    revealVideo, { once: true });
    }
    // Belt-and-braces: if media events never fire (rare mobile cases),
    // still trigger the fade so we don't sit at opacity 0 forever.
    setTimeout(revealVideo, 800);
    // Some mobile browsers gate autoplay even with muted+playsinline.
    bgVideo.play().catch(() => {});

    // ---------- Petal geometry (Bezier shape) ----------
    const petalShape = new THREE.Shape();
    petalShape.moveTo(0, 0);
    petalShape.bezierCurveTo(0.55, 0.25, 0.55, 0.85, 0, 1.05);
    petalShape.bezierCurveTo(-0.55, 0.85, -0.55, 0.25, 0, 0);
    const petalGeo = new THREE.ShapeGeometry(petalShape, 8);
    petalGeo.translate(0, -0.5, 0);
    petalGeo.scale(0.5, 0.5, 0.5);

    // Blurred petal sprite for the far layer (depth-of-field feel)
    function makeBlurredPetalTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.filter = 'blur(14px)';
      ctx.fillStyle = '#ffffff';
      const cx = size / 2;
      const top = size * 0.20;
      const bot = size * 0.82;
      const halfW = size * 0.26;
      ctx.beginPath();
      ctx.moveTo(cx, bot);
      ctx.bezierCurveTo(cx + halfW, bot - (bot - top) * 0.30, cx + halfW, top + (bot - top) * 0.15, cx, top);
      ctx.bezierCurveTo(cx - halfW, top + (bot - top) * 0.15, cx - halfW, bot - (bot - top) * 0.30, cx, bot);
      ctx.closePath();
      ctx.fill();
      const tex = new THREE.CanvasTexture(canvas);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.anisotropy = 4;
      return tex;
    }
    const blurredPetalTex = makeBlurredPetalTexture();
    const blurredPetalGeo = new THREE.PlaneGeometry(0.85, 1.0);

    // ---------- Three parallax layers ----------
    // Each layer: { group, instMesh, state[], factor, fall, count, sizeMul, opacity, zRange }
    const layers = [
      { factor: 1.0,  count: 40,  fall: [0.8, 1.4], size: [0.7, 1.2],  opacity: 0.55, zRange: [-30, -18], blurred: true }, // far
      { factor: 2.6,  count: 50,  fall: [1.1, 1.9], size: [0.9, 1.4],  opacity: 0.85, zRange: [-15,  -3] }, // mid
      { factor: 5.8,  count: 40,  fall: [1.6, 2.6], size: [1.2, 1.9],  opacity: 1.00, zRange: [  0,  10] }, // near
    ];

    const COLOR_LIGHT = new THREE.Color(0xffd1de);
    const COLOR_DEEP  = new THREE.Color(0xff8aa8);
    const COLOR_PALE  = new THREE.Color(0xfff0f5);   // rare brighter petals

    const dummy = new THREE.Object3D();
    const tmpColor = new THREE.Color();

    for (const layer of layers) {
      const matProps = {
        color: 0xffffff,                    // tinted via instanceColor
        side: THREE.DoubleSide,
        transparent: true,
        opacity: layer.opacity,
        depthWrite: false,
      };
      if (layer.blurred) matProps.map = blurredPetalTex;
      const mat = new THREE.MeshBasicMaterial(matProps);
      const geom = layer.blurred ? blurredPetalGeo : petalGeo;
      const inst = new THREE.InstancedMesh(geom, mat, layer.count);
      inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      // Per-layer group for parallax
      const group = new THREE.Group();
      group.add(inst);
      scene.add(group);

      const state = [];
      for (let i = 0; i < layer.count; i++) {
        const s = {
          x: (Math.random() - 0.5) * 60,
          y: -15 + Math.random() * 35,             // pre-distribute vertically
          z: layer.zRange[0] + Math.random() * (layer.zRange[1] - layer.zRange[0]),
          rx: Math.random() * Math.PI * 2,
          ry: Math.random() * Math.PI * 2,
          rz: Math.random() * Math.PI * 2,
          rxv: (Math.random() - 0.5) * 0.5,
          ryv: (Math.random() - 0.5) * 1.0,
          rzv: (Math.random() - 0.5) * 0.4,
          fall: layer.fall[0] + Math.random() * (layer.fall[1] - layer.fall[0]),
          swayPhase: Math.random() * Math.PI * 2,
          swayAmp: 0.5 + Math.random() * 0.9,
          scale: layer.size[0] + Math.random() * (layer.size[1] - layer.size[0]),
        };
        state.push(s);

        // Per-instance color tint: ~15% are noticeably paler
        if (Math.random() < 0.15) {
          tmpColor.copy(COLOR_PALE);
        } else {
          tmpColor.copy(COLOR_LIGHT).lerp(COLOR_DEEP, Math.random());
        }
        tmpColor.offsetHSL(0, (Math.random() - 0.5) * 0.06, (Math.random() - 0.5) * 0.08);
        inst.setColorAt(i, tmpColor);
      }
      if (inst.instanceColor) inst.instanceColor.needsUpdate = true;

      layer.group = group;
      layer.inst  = inst;
      layer.state = state;
    }


    // ---------- Mouse + parallax ----------
    const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
    addEventListener('pointermove', (e) => {
      mouse.tx = (e.clientX / innerWidth)  * 2 - 1;
      mouse.ty = -((e.clientY / innerHeight) * 2 - 1);
    }, { passive: true });
    addEventListener('pointerleave', () => { mouse.tx = 0; mouse.ty = 0; });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      rendererBack.setSize(innerWidth, innerHeight);
      rendererFront.setSize(innerWidth, innerHeight);
    });

    // ---------- Loop ----------
    const clock = new THREE.Clock();
    let time = 0;
    const Y_TOP = 22, Y_BOT = -18;

    function tick() {
      requestAnimationFrame(tick);
      const dt = Math.min(clock.getDelta(), 1/30);
      time += dt;

      // Smooth mouse
      mouse.x += (mouse.tx - mouse.x) * Math.min(1, dt * 4);
      mouse.y += (mouse.ty - mouse.y) * Math.min(1, dt * 4);

      // Background-video parallax (opposite to mouse, matches three.js layers)
      bgVideo.style.setProperty('--px', (-mouse.x).toFixed(3));
      bgVideo.style.setProperty('--py', ( mouse.y).toFixed(3));

      // Parallax: shift each layer opposite to the mouse, deeper = subtler
      for (const layer of layers) {
        layer.group.position.x = -mouse.x * layer.factor;
        layer.group.position.y = -mouse.y * layer.factor * 0.8;

        const st = layer.state;
        for (let i = 0; i < st.length; i++) {
          const s = st[i];
          s.y -= s.fall * dt;
          s.x += Math.sin(time * 0.7 + s.swayPhase) * s.swayAmp * dt;
          s.z += Math.cos(time * 0.5 + s.swayPhase * 1.3) * s.swayAmp * 0.4 * dt;
          s.rx += s.rxv * dt;
          s.ry += s.ryv * dt;
          s.rz += s.rzv * dt;

          if (s.y < Y_BOT) {
            s.y = Y_TOP + Math.random() * 6;
            s.x = (Math.random() - 0.5) * 60;
          }

          dummy.position.set(s.x, s.y, s.z);
          dummy.rotation.set(s.rx, s.ry, s.rz);
          dummy.scale.setScalar(s.scale);
          dummy.updateMatrix();
          layer.inst.setMatrixAt(i, dummy.matrix);
        }
        layer.inst.instanceMatrix.needsUpdate = true;
      }

      // Subtle camera parallax for extra depth feel
      camera.position.x = mouse.x * 1.2;
      camera.position.y = mouse.y * 0.8;
      camera.lookAt(0, 0, 0);

      // Back pass: far + mid (drawn behind the quote overlay)
      layers[0].group.visible = true;
      layers[1].group.visible = true;
      layers[2].group.visible = false;
      rendererBack.render(scene, camera);

      // Front pass: near only (drawn in front of the quote overlay)
      layers[0].group.visible = false;
      layers[1].group.visible = false;
      layers[2].group.visible = true;
      rendererFront.render(scene, camera);
    }
    tick();

    // ---------- Fullscreen toggle (button click + double-click anywhere; Escape exits natively) ----------
    const fsBtn = document.getElementById('fs-btn');
    const fsIcon = document.getElementById('fs-icon');
    const ICON_EXPAND   = '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>';
    const ICON_COMPRESS = '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>';

    function toggleFullscreen() {
      const doc = document;
      const el  = document.documentElement;
      const isFs = doc.fullscreenElement || doc.webkitFullscreenElement;
      if (!isFs) {
        (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
      } else {
        (doc.exitFullscreen || doc.webkitExitFullscreen)?.call(doc);
      }
    }

    fsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFullscreen();
    });
    addEventListener('dblclick', (e) => {
      if (e.target.closest('#fs-btn') || e.target.closest('#audio-ctrl')) return;
      toggleFullscreen();
    });
    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      document.body.classList.toggle('is-fs', isFs);
      fsIcon.innerHTML = isFs ? ICON_COMPRESS : ICON_EXPAND;
      fsBtn.setAttribute('aria-label', isFs ? 'Quitter le plein écran' : 'Plein écran');
      if (!isFs) fsBtn.classList.remove('reveal');
    });

    // Reveal the FS button only when the cursor is in the bottom-right 30% zone (fullscreen only)
    addEventListener('pointermove', (e) => {
      if (!document.body.classList.contains('is-fs')) return;
      const inZone = e.clientX > innerWidth * 0.7 && e.clientY > innerHeight * 0.7;
      fsBtn.classList.toggle('reveal', inZone);
    }, { passive: true });
    addEventListener('pointerleave', () => fsBtn.classList.remove('reveal'));

    // ---------- Background music: hidden YouTube channel player, local music/ fallback ----------
    const bgAudio   = document.getElementById('bg-audio');
    const audioCtrl = document.getElementById('audio-ctrl');
    const auToggle  = document.getElementById('au-toggle');
    const auPrev    = document.getElementById('au-prev');
    const auNext    = document.getElementById('au-next');
    const ICON_PLAY  = '<path d="M7 5 L20 12 L7 19 Z"/>';
    const ICON_PAUSE = '<rect x="6.5" y="5" width="4" height="14" rx="0.8"/><rect x="13.5" y="5" width="4" height="14" rx="0.8"/>';
    // @yugen_ambient — the channel's auto-generated "uploads" playlist (UU + channelId without the leading UC)
    const YT_UPLOADS = 'UUaptN0fxyT89GYPL0xCYsKw';

    let player = null;          // active backend: { isPlaying, toggle, next, prev, autostart }
    let audioStarted = false;
    function markStarted() { audioStarted = true; audioCtrl.classList.remove('hint'); }
    function syncToggle() {
      const playing = !!player && player.isPlaying();
      auToggle.querySelector('svg').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
      auToggle.setAttribute('aria-label', playing ? 'Pause' : 'Lecture');
    }

    // Controls just forward to whichever backend is live.
    auToggle.addEventListener('click', (e) => { e.stopPropagation(); if (player) player.toggle(); });
    auPrev.addEventListener('click',   (e) => { e.stopPropagation(); if (player) player.prev(); });
    auNext.addEventListener('click',   (e) => { e.stopPropagation(); if (player) player.next(); });
    // Near-automatic: kick playback off on the first interaction anywhere
    // (browsers block media playback with sound until a user gesture — true for YouTube too).
    addEventListener('pointerdown', (e) => {
      if (audioStarted || !player || e.target.closest('#audio-ctrl')) return;
      player.autostart();
    });

    // Reveal the audio controls only in the bottom-left 30% zone (fullscreen only)
    addEventListener('pointermove', (e) => {
      if (!document.body.classList.contains('is-fs')) return;
      const inZone = e.clientX < innerWidth * 0.3 && e.clientY > innerHeight * 0.7;
      audioCtrl.classList.toggle('reveal', inZone);
    }, { passive: true });
    addEventListener('pointerleave', () => audioCtrl.classList.remove('reveal'));

    function activatePlayer(backend, hasMulti) {
      player = backend;

    // ----- YouTube backend: hidden iframe playing the channel's uploads on shuffle + loop -----
    const ytlog = (...a) => { try { console.warn('[ketsuryu music]', ...a); } catch (_) {} };
    const mlog  = (...a) => { try { console.log('[ketsuryu music]', ...a); } catch (_) {} };
    function loadYouTubeAPI() {
      return new Promise((resolve, reject) => {
        if (window.YT && window.YT.Player) { resolve(); return; }
        const prev = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = () => { if (typeof prev === 'function') { try { prev(); } catch (_) {} } resolve(); };
        const s = document.createElement('script');
        s.src = 'https://www.youtube.com/iframe_api';
        s.onerror = () => { ytlog('IFrame API script failed to load.'); reject(new Error('yt-api-load-failed')); };
        document.head.appendChild(s);
        setTimeout(() => reject(new Error('yt-api-timeout')), 9000);
      });
    }
    function createYouTubeBackend() {
      return new Promise((resolve, reject) => {
        let resolved = false, fellBack = false, everPlaying = false, cued = false, errStreak = 0, lastVid = null;
        const PS = () => (window.YT && YT.PlayerState) || {};
        const giveUp = (why) => {
          if (fellBack) return; fellBack = true;
          ytlog('YouTube unavailable → falling back to local music/. Reason:', why || '(unknown)');
          try { yt.destroy(); } catch (_) {}
          if (!resolved) { resolved = true; reject(new Error('yt:' + (why || 'unavailable'))); }
          else startLocalFallback();   // YT backend was already live → swap to local
        };
        const yt = new YT.Player('yt-player', {
          width: 200, height: 120,
          playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1, rel: 0 },
          events: {
            onReady: (e) => {
              try { e.target.setVolume(100); } catch (_) {}
              try { e.target.cuePlaylist({ listType: 'playlist', list: YT_UPLOADS }); }
              catch (err) { giveUp('cuePlaylist threw: ' + err); return; }
              setTimeout(() => { if (!cued && !resolved) giveUp('playlist never reached the CUED state within 12s'); }, 12000);
            },
            onStateChange: (e) => {
              const P = PS();
              if (e.data === P.PLAYING) {
                everPlaying = true; errStreak = 0;
                let vid = '', title = '';
                try { const d = e.target.getVideoData && e.target.getVideoData(); if (d) { vid = d.video_id || ''; title = d.title || ''; } } catch (_) {}
                if (vid && vid !== lastVid) {                          // log each time a new video starts (first play, prev/next, auto-advance)
                  lastVid = vid;
                  let idx = -1, len = 0;
                  try { idx = e.target.getPlaylistIndex(); } catch (_) {}
                  try { len = (e.target.getPlaylist() || []).length; } catch (_) {}
                  mlog('▶ YouTube —', title || '(title pending…)', '· https://youtu.be/' + vid + (idx >= 0 && len ? '  · #' + (idx + 1) + '/' + len : ''));
                }
              }
              if (e.data === P.ENDED) { try { e.target.nextVideo(); } catch (_) {} }   // belt-and-braces if shuffle+loop didn't auto-advance

              if (e.data === P.CUED && !cued) {
                cued = true;
                try { e.target.setShuffle(true); } catch (_) {}
                try { e.target.setLoop(true); } catch (_) {}
                try { e.target.setPlaybackQuality('small'); } catch (_) {}
                let pl = []; try { pl = e.target.getPlaylist() || []; } catch (_) {}
                ytlog('playlist cued —', pl.length, 'video(s).');
                if (!pl.length) { giveUp('uploads playlist is empty / not loadable'); return; }
                const isPlaying = () => { const s = e.target.getPlayerState(); return s === P.PLAYING || s === P.BUFFERING; };
                let userTriggered = false;
                const startRandom = () => {
                  markStarted(); userTriggered = true;
                  let list = []; try { list = e.target.getPlaylist() || []; } catch (_) {}
                  try { if (list.length) e.target.playVideoAt((Math.random() * list.length) | 0); else e.target.playVideo(); }
                  catch (_) { try { e.target.playVideo(); } catch (_) {} }
                  setTimeout(() => { if (!everPlaying && !fellBack) giveUp('nothing actually playing 10s after the first play attempt'); }, 10000);
                };
                resolved = true;
                resolve({
                  isPlaying,
                  toggle: () => {
                    if (isPlaying()) { try { e.target.pauseVideo(); } catch (_) {} }
                    else if (!userTriggered) startRandom();
                    else { markStarted(); try { e.target.playVideo(); } catch (_) {} }
                  },
                  next: () => { mlog('⏭ next track…'); startRandom(); },
                  prev: () => { mlog('⏮ previous track…'); markStarted(); userTriggered = true; try { e.target.previousVideo(); } catch (_) { startRandom(); } },
                  autostart: () => { if (!userTriggered) startRandom(); },
                });
              }
              syncToggle();
            },
            onError: (e) => {
              ytlog('player error, code', e.data, '(2=bad param, 5=html5, 100=removed/private, 101/150=embedding disabled)');
              if (e.data === 2) { giveUp('invalid playlist parameter (error 2)'); return; }   // retrying won't help
              if (everPlaying) { try { e.target.nextVideo(); } catch (_) {} return; }            // a single dud video → skip it
              if (++errStreak >= 4) giveUp('repeated playback errors before anything played (last code ' + e.data + ')');
              else { try { e.target.nextVideo(); } catch (_) {} }
            },
          },
        });
        setTimeout(() => { if (!resolved) giveUp('player never became ready within 12s'); }, 12000);
      });
    }

    // ----- Local backend: the music/ folder, discovered at runtime (fallback only) -----
    async function discoverLocalPlaylist() {
      try {
        const res = await fetch('music/', { cache: 'no-store' });
        if (res.ok) {
          const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
          const files = [...doc.querySelectorAll('a[href]')]
            .map(a => decodeURIComponent(a.getAttribute('href').split('/').pop().split('?')[0].split('#')[0]))
            .filter(n => /\.mp3$/i.test(n));
          if (files.length) {
            files.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
            return files.map(n => 'music/' + n);
          }
        }
      } catch (_) { /* fall through to probing */ }
      const found = [];
      for (let i = 1; i <= 50; i++) {
        const url = `music/${i}.mp3`;
        try { const r = await fetch(url, { method: 'HEAD', cache: 'no-store' }); if (!r.ok) break; found.push(url); }
        catch (_) { break; }
      }
      return found;
    }
    function makeLocalBackend(list) {
      let curIdx = -1; const history = [];
      bgAudio.loop = list.length === 1;   // single track → seamless native loop
      const rnd = () => { if (list.length <= 1) return 0; let i; do { i = (Math.random() * list.length) | 0; } while (i === curIdx); return i; };
      const playIdx = (i, autoplay) => {
        curIdx = ((i % list.length) + list.length) % list.length;
        bgAudio.src = list[curIdx];
        if (autoplay) { markStarted(); bgAudio.play().catch(() => {}); }
      };
      const next = (autoplay) => { if (curIdx >= 0) { history.push(curIdx); if (history.length > 100) history.shift(); } playIdx(rnd(), autoplay); };
      const prev = (autoplay) => playIdx(history.length ? history.pop() : rnd(), autoplay);
      const trackLabel = () => list[curIdx] + ' · #' + (curIdx + 1) + '/' + list.length;
      bgAudio.addEventListener('play',  () => { mlog('▶ local —', trackLabel()); syncToggle(); });
      bgAudio.addEventListener('pause', syncToggle);
      bgAudio.addEventListener('ended', () => { if (!bgAudio.loop) next(true); });
      playIdx(0, false);          // point at the first track; nothing downloads yet (preload=none)
      bgAudio.preload = 'auto';   // page is fully loaded → safe to pre-buffer now
      return {
        isPlaying: () => !bgAudio.paused && !bgAudio.ended,
        toggle: () => { markStarted(); if (bgAudio.paused) bgAudio.play().catch(() => {}); else bgAudio.pause(); },
        next: () => { mlog('⏭ next track…'); next(true); },
        prev: () => { mlog('⏮ previous track…'); prev(true); },
        autostart: () => { markStarted(); bgAudio.play().catch(() => {}); },
      };
    }
    let localFallbackStarted = false;
    async function startLocalFallback() {
      if (localFallbackStarted) return; localFallbackStarted = true;
      audioCtrl.classList.remove('ready', 'multi');   // reset before re-activating with the local layout
      const list = await discoverLocalPlaylist();
      if (!list.length) { player = null; audioCtrl.style.display = 'none'; return; }
      activatePlayer(makeLocalBackend(list), list.length > 1);
    }

    // ----- Init: try YouTube first, fall back to local music/ on any failure -----
    async function initAudio() {
      try {
        await loadYouTubeAPI();
        const backend = await createYouTubeBackend();
        activatePlayer(backend, true);   // a channel playlist always has prev/next
        ytlog('YouTube backend ready — press play (or click anywhere) to start.');
      } catch (err) {
        ytlog('YouTube path failed (', String(err && err.message || err), ') — using local music/.');
        await startLocalFallback();
      }
    }

    // YouTube API + iframe (or mp3 buffering) never competes with the bg video,
    // petal textures or Three.js. (setTimeout = backstop if `load` is delayed.)
    let audioInitStarted = false;
    const startAudioInit = () => { if (!audioInitStarted) { audioInitStarted = true; initAudio(); } };
    if (document.readyState === 'complete') startAudioInit();
    else { addEventListener('load', startAudioInit, { once: true }); setTimeout(startAudioInit, 6000); }

    const quoteEl = document.getElementById('quote');

    const quoteAuthor = quoteEl.querySelector('.author');
    const QUOTE_FADE_MS = 1800;
    let lastQuoteIdx = -1;

    function pickQuote() {
      let i;
      do { i = (Math.random() * QUOTES.length) | 0; } while (QUOTES.length > 1 && i === lastQuoteIdx);
      lastQuoteIdx = i;
      return QUOTES[i];
    }
    const rrand = (a, b) => a + Math.random() * (b - a);
    const wait  = (ms) => new Promise(r => setTimeout(r, ms));

    async function quoteLoop() {
      await wait(7000);
      while (true) {
        const q = pickQuote();
        quoteText.textContent = '« ' + q.t + ' »';
        quoteAuthor.textContent = q.a;
        void quoteEl.offsetWidth; // force reflow before transition
        quoteEl.classList.add('visible');
        await wait(QUOTE_FADE_MS + rrand(6500, 9500));
        quoteEl.classList.remove('visible');
        await wait(QUOTE_FADE_MS + rrand(4000, 7000));
      }
    }
